name: Use Reusable PROD BUILD & DEPLOY Workflow
on:
  release:
    types: [published]
permissions: write-all
jobs:
  build-ui:
    if:
      github.event_name == 'release' && startsWith(github.ref, 'refs/tags/') && contains(github.ref,
      '-build')
    uses: lumenbiomics/GitOpsEngine/.github/workflows/push-prod.yml@ui-build-deploy
    with:
      input-file: 'dockerfiles.json'
    secrets:
      DEV_DOCKER_REGISTRY_USERNAME: ${{ secrets.DEV_DOCKER_REGISTRY_USERNAME }}
      DEV_DOCKER_REGISTRY_PASSWORD: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}
      PROD_DOCKER_REGISTRY_USERNAME: ${{ secrets.PROD_DOCKER_REGISTRY_USERNAME }}
      PROD_DOCKER_REGISTRY_PASSWORD: ${{ secrets.PROD_DOCKER_REGISTRY_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      PCC_CONSOLE_URL: ${{ secrets.PCC_CONSOLE_URL }}
      PCC_USERNAME: ${{ secrets.PCC_USERNAME }}
      PCC_PASSWORD: ${{ secrets.PCC_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  deployment-ui:
    if:
      github.event_name == 'release' && startsWith(github.ref, 'refs/tags/') && contains(github.ref,
      '-deploy')
    needs: build-ui
    uses: lumenbiomics/GitOpsEngine/.github/workflows/build-deploy-ui.yml@ui-build-deploy
    with:
      input-file: 'dockerfiles.json'
    secrets:
      DEV_DOCKER_REGISTRY_USERNAME: ${{ secrets.DEV_DOCKER_REGISTRY_USERNAME }}
      DEV_DOCKER_REGISTRY_PASSWORD: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
