name: Use Reusable BUILD & DEPLOY Workflow

on:
  push:
    tags:
      - '*build*'

jobs:
  build-ui:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-build')
    uses: lumenbiomics/GitOpsEngine/.github/workflows/push-dev.yml@ui-build-deploy
    with:
      input-file: 'dockerfiles.json'
    secrets:
      DEV_DOCKER_REGISTRY_USERNAME: ${{ secrets.DEV_DOCKER_REGISTRY_USERNAME }}
      DEV_DOCKER_REGISTRY_PASSWORD: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      PCC_CONSOLE_URL: ${{ secrets.PCC_CONSOLE_URL }}
      PCC_USERNAME: ${{ secrets.PCC_USERNAME }}
      PCC_PASSWORD: ${{ secrets.PCC_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  deployment-ui:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-deploy')
    needs: build-ui
    uses: lumenbiomics/GitOpsEngine/.github/workflows/build-deploy-ui.yml@ui-build-deploy
    with:
      input-file: 'dockerfiles.json'
    secrets:
      DEV_DOCKER_REGISTRY_USERNAME: ${{ secrets.DEV_DOCKER_REGISTRY_USERNAME }}
      DEV_DOCKER_REGISTRY_PASSWORD: ${{ secrets.DEV_DOCKER_REGISTRY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
